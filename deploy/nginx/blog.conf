# 宿主 nginx 片段（人工部署到 /etc/nginx/sites-available/blog.conf）
#
# 只做五件事：80→443、TLS、静态图片直出、限流/防盗链、反代 127.0.0.1:8640。
# 明确不缓存 HTML（C6）；proxy_cache_path 只留注释位（§12 预留）。
#
# 依赖：blog_proxy_params 需落到 /etc/nginx/conf.d/（见 runbook §10）。
# 部署后务必 `sudo nginx -t`，再用 `curl -I` 逐条验（runbook §19）。

# 预留：后期开启 HTML 缓存时不改 upstream。
# proxy_cache_path /var/cache/nginx/blog levels=1:2 keys_zone=blog_cache:10m max_size=200m inactive=1h use_temp_path=off;

upstream blog_public {
    server 127.0.0.1:8640;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=blog_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name blog.zjut.si;

    # certbot 续期用（HTTP-01 challenge 必须走 80）。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2：nginx ≥1.25.1 用 `http2 on;`；Ubuntu 24.04 自带的 1.24 需写成
    # `listen 443 ssl http2;`。部署前按实际版本二选一，不改动可先不开。
    server_name blog.zjut.si;

    ssl_certificate     /etc/letsencrypt/live/blog.zjut.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.zjut.si/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    # 全站强制 HTTPS（80 段已 301）。刻意不加 includeSubDomains：
    # 宿主上还有与本项目无关的服务，别让 HSTS 波及它们。
    # 不想要这一行就直接删掉，其余配置不受影响。
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 32m;

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log warn;

    # 图片：nginx 直出磁盘，路径含内容哈希，永久缓存（C10 / §12）。
    #
    # 用 root 而不是 alias：`alias` + `try_files` 在 nginx 1.24 上会把 URI 拼错
    # （alias 与 try_files 同用时 $uri 语义不一致）。目录名与 URL 前缀同名，
    # 所以 `root /data/blog;` 就能把 /uploads/ab/cd/… 映射到 /data/blog/uploads/ab/cd/…。
    #
    # 附件（/data/blog/files）**不要**在这里直出：它只经 /api/attachments/{id}/go 出口，
    # 由 Go 发 Content-Disposition: attachment + octet-stream + nosniff，才能保证
    # 任何扩展名都不会被浏览器当页面渲染（runbook §11）。
    #
    # 权限：容器以 uid 1000 写文件（目录 0750、文件 0640），nginx 默认用户 www-data
    # 读不到。部署前执行一次（-d 是默认 ACL，之后新文件自动继承）：
    #   sudo setfacl -R  -m u:www-data:rX /data/blog/uploads
    #   sudo setfacl -R -d -m u:www-data:rX /data/blog/uploads
    #
    # 只映射 uploads 子目录；绝不要把 /data/blog 整个暴露出去，那会把 blog.db 送上网。
    location /uploads/ {
        root /data/blog;
        try_files $uri =404;

        # location 里的 add_header 会覆盖 server 级同名指令，所以这里要重复一遍 HSTS。
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # 防盗链：直接甩链接的第三方页面拿不到图（curl / 本机引用不受影响）。
        valid_referers none blocked server_names blog.zjut.si;
        if ($invalid_referer) {
            return 403;
        }
    }

    # 管理端永远不该在公网出现：显式拒绝，双保险（C4）。
    # 正则 location 优先于前缀 location，所以 /api/admin/* 命中这里而不是下面的 /api/。
    location ~ ^/(admin|api/admin) {
        return 404;
    }

    location /api/ {
        limit_req zone=blog_api burst=40 nodelay;
        proxy_pass http://blog_public;
        include /etc/nginx/conf.d/blog_proxy_params;
    }

    location / {
        proxy_pass http://blog_public;
        include /etc/nginx/conf.d/blog_proxy_params;
    }
}
