# 宿主 nginx 片段（人工部署到 /etc/nginx/sites-available/blog.conf）
#
# 只做四件事：TLS/80 入口、静态图片直出、限流/防盗链、反代 127.0.0.1:8640。
# 明确不缓存 HTML（C6）；proxy_cache_path 只留注释位（§12 预留）。

# 预留：后期开启 HTML 缓存时不改 upstream。
# proxy_cache_path /var/cache/nginx/blog levels=1:2 keys_zone=blog_cache:10m max_size=200m inactive=1h use_temp_path=off;

upstream blog_public {
    server 127.0.0.1:8640;
    keepalive 16;
}

limit_req_zone $binary_remote_addr zone=blog_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name blog.zjut.si;

    # certbot 续期用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/2：nginx ≥1.25.1 用 `http2 on;`；Ubuntu 24.04 自带的 1.24 需写成
    # `listen 443 ssl http2;`。部署前按实际版本二选一，不改动可先不开。
    server_name blog.zjut.si;

    ssl_certificate     /etc/letsencrypt/live/blog.zjut.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.zjut.si/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 32m;

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log warn;

    # 图片：nginx 直出磁盘，路径含内容哈希，永久缓存（C10 / §12）。
    location /uploads/ {
        alias /data/blog/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        valid_referers none blocked server_names blog.zjut.si;
        if ($invalid_referer) {
            return 403;
        }
        try_files $uri =404;
    }

    # 管理端永远不该在公网出现：显式拒绝，双保险（C4）。
    location ~ ^/(admin|api/admin) {
        return 404;
    }

    location /api/ {
        limit_req zone=blog_api burst=40 nodelay;
        proxy_pass http://blog_public;
        include /etc/nginx/conf.d/blog_proxy_params;
    }

    location / {
        proxy_pass http://blog_public;
        include /etc/nginx/conf.d/blog_proxy_params;
    }
}
